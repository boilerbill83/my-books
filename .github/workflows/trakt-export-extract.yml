name: Daily Full Trakt Extract

on:
  schedule:
    - cron: '0 12 * * *'   # daily 12:00 UTC (after both TMDB/OMDb enrichment jobs and the Sunday discovery job)
  workflow_dispatch: {}

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate full watched + watchlist + candidate extract
        run: node trakt/scripts/export_extract.js

      - name: Publish snapshot to data-snapshots branch
        run: |
          # Dated CSV snapshots live on the data-snapshots branch, not main,
          # so they don't bloat the repo or the published site (moved there
          # Nov 2026). Main is never touched by this step.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEW="$(ls trakt/output/all-titles-*.csv | tail -1)"
          echo "Snapshot file: $NEW"
          git fetch origin data-snapshots
          git worktree add --detach /tmp/snap origin/data-snapshots
          cd /tmp/snap
          mkdir -p trakt/output
          cp "$GITHUB_WORKSPACE/$NEW" "trakt/output/"
          git add "trakt/output/$(basename "$NEW")"
          if git diff --staged --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git commit -m "Daily full Trakt extract [automated]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:data-snapshots; then
              exit 0
            fi
            echo "Push rejected (attempt $i/5) - fetching and rebasing onto latest data-snapshots."
            git fetch origin data-snapshots
            git rebase origin/data-snapshots
          done
          echo "::error::Failed to push after 5 rebase attempts."
          exit 1
