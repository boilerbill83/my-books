name: Resolve Manual Candidate Titles (TMDB search)

on:
  workflow_dispatch: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve titles to TMDB ids and add stub candidates
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 trakt/resolve_titles.py
        timeout-minutes: 15
      - name: Commit if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Rebase onto whatever branch actually triggered this run, not a
          # hardcoded main - a real bug found 2026-09-03: manually dispatching
          # these workflows against a feature branch (common this session, for
          # faster iteration than waiting on the daily main-branch schedule)
          # meant a push-reject retry rebased onto origin/main instead of the
          # feature branch it was actually running on, producing real merge
          # conflicts against unrelated main-branch history and silently
          # discarding a real TMDB API-fetch pass (topCastDetail backfill, run
          # 33701084686) that had already succeeded locally.
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          git add trakt/data/
          if git diff --staged --quiet; then
            echo "No new candidates."
            exit 0
          fi
          git commit -m "Resolve manual candidate titles via TMDB search [automated]"
          # Same race the TMDB enrichment job hit: a long run can lose a
          # push to any other scheduled workflow that lands on main first.
          # Rebase and retry rather than losing a long run's real output.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i/5) - fetching and rebasing onto latest $BRANCH."
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          echo "::error::Failed to push after 5 rebase attempts."
          exit 1
