name: Resolve Manual Candidate Titles (TMDB search)

on:
  workflow_dispatch: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve titles to TMDB ids and add stub candidates
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 trakt/resolve_titles.py
        timeout-minutes: 15
      - name: Commit if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trakt/data/
          git diff --staged --quiet && echo "No new candidates." || \
            (git commit -m "Resolve manual candidate titles via TMDB search [automated]" && git push)
