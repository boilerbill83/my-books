name: Sync Goodreads Shelves

# Scheduled triggers removed 2026-10-28: Goodreads broke anonymous shelf
# access entirely that day (every RSS URL variant 404s, and the plain
# anonymous HTML shelf page now redirects to a sign-in wall -- confirmed
# via a real diagnostic run, not guessed; see CLAUDE.md's Workflows
# section and Session 81 in the Data Enrichment Sessions Log for the full
# investigation). Bill's decision: stick with manual CSV export + BBIP
# import for the full read/to-read shelf sync rather than chase an
# authenticated-scraping replacement. workflow_dispatch is kept in case
# Goodreads ever restores anonymous access and this is worth retrying.
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync Goodreads shelves
        run: python3 sync_goodreads.py
        timeout-minutes: 5

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          git add data/goodreadsData.json
          if git diff --staged --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git commit -m "Sync Goodreads shelves [automated]"
          # Same push-race hardening as the Trakt-side workflows (Session 50)
          # and data-quality-report.yml (hit for real 2026-09-10) - rebase
          # and retry rather than losing a real run's output.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i/5) - fetching and rebasing onto latest $BRANCH."
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          echo "::error::Failed to push after 5 rebase attempts."
          exit 1
