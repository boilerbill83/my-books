name: Enrich ISBN13

on:
  schedule:
    - cron: '0 4 * * 0'   # Sundays 4 AM UTC (catches new books from weekly sync)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Backfill ISBN13 via Google Books API
        env:
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        run: python3 enrich_isbn.py
        timeout-minutes: 30

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          git add data/
          if git diff --staged --quiet; then
            echo "No new ISBNs found."
            exit 0
          fi
          git commit -m "Backfill ISBN13 via Google Books [automated]"
          # Same push-race hardening as the Trakt-side workflows (Session 50)
          # and data-quality-report.yml (hit for real 2026-09-10) - rebase
          # and retry rather than losing a real run's output.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i/5) - fetching and rebasing onto latest $BRANCH."
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          echo "::error::Failed to push after 5 rebase attempts."
          exit 1
