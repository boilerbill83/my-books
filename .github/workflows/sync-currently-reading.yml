name: Sync Currently Reading

on:
  schedule:
    - cron: '0  3 * * *'   # 3:00 AM UTC
    - cron: '0  9 * * *'   # 9:00 AM UTC
    - cron: '0 15 * * *'   # 3:00 PM UTC
    - cron: '0 21 * * *'   # 9:00 PM UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch currently-reading shelf from Goodreads
        run: python3 sync_currently_reading.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          git add data/currentlyReading.json
          if git diff --staged --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git commit -m "Sync currently reading [automated]"
          # This job runs 4x/day - a real collision risk. Same push-race
          # hardening as the Trakt-side workflows (Session 50) and
          # data-quality-report.yml (hit for real 2026-09-10) - rebase and
          # retry rather than losing a real run's output.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i/5) - fetching and rebasing onto latest $BRANCH."
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          echo "::error::Failed to push after 5 rebase attempts."
          exit 1
