name: Trakt Paired-Layout Check

# Mechanically enforces CLAUDE.md's standing "when two cards/sections sit
# side by side in a row, check they render at the same height" rule, so a
# regression is caught automatically on every push instead of needing
# Bill to notice and report it (his own explicit instruction, 2026-10-01:
# "automatically I shouldn't have to tell you"). The rule itself existed
# in CLAUDE.md for a long time before this workflow — the gap was
# enforcement: a session would check whichever failure mode seemed
# relevant to whatever was just reported and conclude a row was fine,
# without checking the other 2 documented modes. This runs all 3, on
# every paired row, on every push, and fails the run (red check) on any
# violation.
#
# See trakt/verify_paired_layouts.py's own docstring for the full
# mechanics and the real bugs it caught the day it was built.
#
# Also runs on a daily SCHEDULE (added Oct 2026, per Bill's "add a daily
# check to look for these kind of issues and fix them... only if it wont
# use my claude API budget"). The push trigger above only re-checks when
# trakt/*.html/*.css/*.js actually changes - but the real bug that
# prompted this (the #nextWatch card's content not filling its stretched
# height) was DATA-driven, not code-driven: the layout code hadn't
# changed, the live watchlist had just drifted down to only 6 qualifying
# picks that day. A pure code-push trigger can never catch that - only a
# recurring re-check of the live page against whatever data exists today
# can. This whole script is Playwright + plain DOM measurement, zero LLM
# calls anywhere in it, so a daily run costs nothing against Bill's
# Claude API budget - same "zero API cost" property every other
# mechanical check in this project already has (data_quality_report.js,
# the book side's eval.js, etc.). It still only DETECTS and fails loud
# (red check + GitHub's own default failure-notification email) rather
# than silently rewriting CSS - a genuine fix for an arbitrary future
# violation needs real judgment about the right remedy (see today's
# #nextWatch fix, which needed a specific align-content choice, not a
# generic "shrink something" heuristic), and building a blind auto-
# corrector for layout bugs without any intelligence in the loop isn't
# realistically safe - that's exactly the kind of judgment call this
# daily run can't make, so it reports clearly instead of guessing.
on:
  push:
    paths:
      - 'trakt/*.html'
      - 'trakt/*.css'
      - 'trakt/*.js'
      - 'trakt/verify_paired_layouts.py'
      - 'styles.css'
      - '.github/workflows/trakt-verify-layouts.yml'
  schedule:
    - cron: '0 13 * * *'   # daily 1 PM UTC - after the morning enrich/export cascade (TMDB 8am, OMDb 9am, export-extract/cache-posters noon), so it's checking the day's freshest data
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: Check every paired row on every trakt page
        run: python3 trakt/verify_paired_layouts.py
