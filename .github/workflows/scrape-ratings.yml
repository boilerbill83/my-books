name: Scrape StoryGraph + Amazon Ratings

on:
  schedule:
    - cron: '17 2  * * *'   # 2:17 AM UTC
    - cron: '43 7  * * *'   # 7:43 AM UTC
    - cron: '31 12 * * *'   # 12:31 PM UTC
    - cron: '52 17 * * *'   # 5:52 PM UTC
    - cron: '08 22 * * *'   # 10:08 PM UTC
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Books to process (default 25)'
        required: false
        default: '25'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Scrape ratings
        run: |
          BATCH=${{ github.event.inputs.batch_size || '25' }}
          python3 scrape_ratings.py "$BATCH"
        timeout-minutes: 90

      - name: Commit updated ratings cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          git add data/scrapedRatings.json
          if git diff --staged --quiet; then
            echo "No new ratings scraped."
            exit 0
          fi
          git commit -m "Scrape ratings batch [automated]"
          # This job runs 5x/day - the highest collision risk of any book-
          # side workflow. Same push-race hardening as the Trakt-side
          # workflows (Session 50) and data-quality-report.yml (hit for
          # real 2026-09-10) - rebase and retry rather than losing a real
          # run's output.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i/5) - fetching and rebasing onto latest $BRANCH."
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          echo "::error::Failed to push after 5 rebase attempts."
          exit 1
