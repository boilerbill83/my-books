name: Audit Theme/Tone Accuracy

# Hourly until every book has been researched against real outside sources
# (not the cached enrichedMetadata.json description the tagging classifier
# already used — checking against its own source would be circular). Each
# run researches the next unaudited batch, then applies only the
# high-confidence corrections the research turns up; anything less than
# high confidence goes into output/tone-theme-audit-log.jsonl for review
# instead of touching the data. See CLAUDE.md's Session 16c entry.
#
# Consider disabling this workflow once the backlog clears — the script
# exits cheaply (no API calls) once every book is audited, but there's no
# reason to keep firing hourly after that.
on:
  schedule:
    - cron: '0 * * * *'   # hourly — hits a real, billed Claude API web-search tool per book
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'How many books to audit this run'
        default: '20'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Research next batch (Claude + web search)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 audit_theme_tone.py "${{ inputs.batch_size || '20' }}"
        timeout-minutes: 45

      - name: Apply high-confidence corrections
        run: node scripts/apply_audit_corrections.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ output/tone-theme-audit-log.jsonl
          git diff --staged --quiet && echo "No changes." || \
            (git commit -m "Audit theme/tone accuracy [automated]" && git push)
