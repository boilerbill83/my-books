name: Enrich Trakt Metadata (OMDb — audience score + awards)

on:
  schedule:
    - cron: '0 9 * * *'   # daily 9 AM UTC (after the TMDB enrichment job's 8 AM)
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'How many titles to enrich this run (default 150 on schedule)'
        type: number
        default: 150

jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch Rotten Tomatoes/Metacritic + awards from OMDb
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: python3 trakt/enrich_omdb.py ${{ inputs.batch_size || 150 }}
        timeout-minutes: 30
      - name: Commit if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trakt/data/
          if git diff --staged --quiet; then
            echo "No new metadata."
            exit 0
          fi
          git commit -m "Enrich Trakt metadata via OMDb [automated]"
          # Same race the TMDB job hit: a long run can lose a push to any
          # other scheduled workflow that lands on main first. Rebase and
          # retry rather than losing a long run's real output.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i/5) - fetching and rebasing onto latest main."
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Failed to push after 5 rebase attempts."
          exit 1
