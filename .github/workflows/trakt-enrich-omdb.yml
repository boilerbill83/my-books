name: Enrich Trakt Metadata (OMDb — audience score + awards)

on:
  schedule:
    - cron: '0 9 * * *'   # daily 9 AM UTC (after the TMDB enrichment job's 8 AM)
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'How many titles to enrich this run (default 150 on schedule)'
        type: number
        default: 150
      retry_no_rt:
        description: 'Re-fetch cached titles missing Rotten Tomatoes specifically (OMDb data can be backfilled after the original fetch)'
        type: boolean
        default: false
      retry_no_director:
        description: 'Re-fetch cached movies missing a director (backfills the new director field onto entries cached before it was captured)'
        type: boolean
        default: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch Rotten Tomatoes/Metacritic + awards from OMDb
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          RETRY_NO_RT: ${{ inputs.retry_no_rt && '1' || '0' }}
          RETRY_NO_DIRECTOR: ${{ inputs.retry_no_director && '1' || '0' }}
        run: python3 trakt/enrich_omdb.py ${{ inputs.batch_size || 150 }}
        timeout-minutes: 30
      - name: Commit if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Rebase onto whatever branch actually triggered this run, not a
          # hardcoded main - a real bug found 2026-09-03: manually dispatching
          # these workflows against a feature branch (common this session, for
          # faster iteration than waiting on the daily main-branch schedule)
          # meant a push-reject retry rebased onto origin/main instead of the
          # feature branch it was actually running on, producing real merge
          # conflicts against unrelated main-branch history and silently
          # discarding a real TMDB API-fetch pass (topCastDetail backfill, run
          # 33701084686) that had already succeeded locally.
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          git add trakt/data/
          if git diff --staged --quiet; then
            echo "No new metadata."
            exit 0
          fi
          git commit -m "Enrich Trakt metadata via OMDb [automated]"
          # Same race the TMDB job hit: a long run can lose a push to any
          # other scheduled workflow that lands on main first. Rebase and
          # retry rather than losing a long run's real output.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i/5) - fetching and rebasing onto latest $BRANCH."
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          echo "::error::Failed to push after 5 rebase attempts."
          exit 1
