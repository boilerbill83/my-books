name: Discover Trakt Candidates (weekly refresh)

on:
  schedule:
    - cron: '0 10 * * 0'   # weekly, Sundays 10 AM UTC (after both daily 8/9 AM enrichment jobs)
  workflow_dispatch:
    inputs:
      # Defaults rebalanced 2026-09 per the closed-loop-discovery dashboard
      # finding: discover_candidates.js (the similarity-graph discoverer)
      # and discover_explore.py (the independent genre-explore discoverer,
      # fixed to paginate this same session) used to run at a 30-vs-20
      # ratio, biased toward the closed-loop side. A real production run
      # this session (explore_max_new_per_type=50, explore_top_genres_per_type=8,
      # with the pagination fix live) found 50 new genre-explore candidates
      # PER TYPE in one run - proof this source can sustain a much higher
      # rate than the old default assumed. Rebalanced toward genre-explore
      # and throttled the closed-loop side back moderately (not disabled -
      # it still serves a real purpose: following Bill's taste as he rates
      # new loved titles) so every future UNATTENDED weekly run keeps
      # shrinking the closed-loop share, not just a manually-dispatched one.
      #
      # Rebalanced again 2026-09-11 ("big bang" push): a zero-override
      # verification run under the FIRST rebalance (20 vs 40/8) actually
      # moved the closed-loop share the WRONG way (75.7%->76.4%) - both
      # discoverers added their full quota (40 closed-loop, 80 genre-
      # explore raw additions), but closed-loop's citation-bonus scoring
      # advantage meant its new additions won far more of the open,
      # non-reserved pruning competition. Root-caused with the real job
      # log, not guessed: discover_explore.py was also wasting a real
      # share of its own additions on animated titles that isAnimation()
      # discards on every prune regardless of score (fixed the same day,
      # see discover_explore.py). Three changes together, not one: (1)
      # max_new_per_type throttled 20->10 (closed-loop structurally wins
      # open competition, so slowing its OWN growth rate matters more than
      # genre-explore's raw volume alone); (2) explore_max_new_per_type
      # raised 40->60 and explore_top_genres_per_type 8->12 (the prior
      # 8-genre mix was already largely exhausted - 1483 raw /discover
      # results yielded only 80 genuinely new candidates that run); (3)
      # prune_candidate_pool.js's RESERVED_EXPLORE_SHARE raised 25%->45%
      # (see that file's own comment - a direct sweep test proved the old
      # 25% floor wasn't even binding, so this alone would have done
      # nothing without fixes 1-2 first).
      max_new_per_type:
        description: 'Max new candidates to discover per type (movie/show) this run'
        type: number
        default: 10
      explore_max_new_per_type:
        description: 'Max new genre-explore candidates to discover per type this run (independent of the similarity-graph discovery above - see discover_explore.py)'
        type: number
        default: 60
      explore_top_genres_per_type:
        description: 'How many of Bill''s real top loved genres to query TMDB /discover against, per type'
        type: number
        default: 12
      enrich_batch_size:
        description: 'How many titles enrich_tmdb.py should process this run'
        type: number
        default: 150
      cap_per_type:
        description: 'Candidate pool cap per type (movies/shows), lowest scorers evicted beyond this'
        type: number
        default: 200

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Discover new candidates from loved titles' TMDB similar/recommendations network
        # NOTE: inputs.* is undefined on a schedule-triggered run (no
        # workflow_dispatch inputs exist for a cron firing), so these ||
        # fallbacks - not the input schema's own `default:` above - are
        # what actually governs the real unattended weekly run. Keep both
        # in sync; a schema-only default change silently does nothing for
        # the cron.
        run: node trakt/scripts/discover_candidates.js ${{ inputs.max_new_per_type || 10 }}

      - name: Discover new candidates from TMDB's genre-filtered /discover endpoint (independent of the similarity graph above)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 trakt/discover_explore.py ${{ inputs.explore_max_new_per_type || 60 }} ${{ inputs.explore_top_genres_per_type || 12 }}
        timeout-minutes: 15

      - name: Enrich newly-discovered candidates via TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 trakt/enrich_tmdb.py ${{ inputs.enrich_batch_size || 150 }}
        timeout-minutes: 30

      - name: Prune pool to cap size, evicting lowest scorers
        # Runs even if the TMDB enrich step above failed (e.g. a bad/expired
        # key) - pruning the already-enriched backlog and sweeping stale
        # watched/watchlisted entries is a useful, independent maintenance
        # step regardless of whether this run's new discoveries got scored.
        # prune_candidate_pool.js already never evicts an unenriched
        # candidate, so a failed enrich step just means this week's new
        # stubs sit unscored (kept) until a future run enriches them.
        if: always()
        run: node trakt/scripts/prune_candidate_pool.js ${{ inputs.cap_per_type || 200 }}

      - name: Commit if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Rebase onto whatever branch actually triggered this run, not a
          # hardcoded main - a real bug found 2026-09-03: manually dispatching
          # these workflows against a feature branch (common this session, for
          # faster iteration than waiting on the daily main-branch schedule)
          # meant a push-reject retry rebased onto origin/main instead of the
          # feature branch it was actually running on, producing real merge
          # conflicts against unrelated main-branch history and silently
          # discarding a real TMDB API-fetch pass (topCastDetail backfill, run
          # 33701084686) that had already succeeded locally.
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          git add trakt/data/
          if git diff --staged --quiet; then
            echo "No new candidates this run."
            exit 0
          fi
          git commit -m "Weekly candidate discovery + prune [automated]"
          # Same race the other Trakt jobs hit: a long run can lose a push
          # to another scheduled workflow landing on main first. Rebase
          # and retry rather than losing a real run's output.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i/5) - fetching and rebasing onto latest $BRANCH."
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          echo "::error::Failed to push after 5 rebase attempts."
          exit 1
