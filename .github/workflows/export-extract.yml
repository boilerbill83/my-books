name: Weekly Full Book Extract

on:
  schedule:
    - cron: '0 8 * * 1'   # Mondays 8 AM UTC
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate full book + metadata extract
        run: node scripts/export_extract.js

      - name: Publish snapshot to data-snapshots branch
        run: |
          # Dated CSV snapshots live on the data-snapshots branch, not main,
          # so they don't bloat the repo or the published site (moved there
          # Nov 2026). Main is never touched by this step.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEW="$(ls output/all-books-*.csv | tail -1)"
          echo "Snapshot file: $NEW"
          git fetch origin data-snapshots
          git worktree add --detach /tmp/snap origin/data-snapshots
          cd /tmp/snap
          mkdir -p output
          cp "$GITHUB_WORKSPACE/$NEW" "output/"
          git add "output/$(basename "$NEW")"
          if git diff --staged --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git commit -m "Weekly full book extract [automated]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:data-snapshots; then
              exit 0
            fi
            echo "Push rejected (attempt $i/5) - fetching and rebasing onto latest data-snapshots."
            git fetch origin data-snapshots
            git rebase origin/data-snapshots
          done
          echo "::error::Failed to push after 5 rebase attempts."
          exit 1
