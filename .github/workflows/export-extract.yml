name: Weekly Full Book Extract

on:
  schedule:
    - cron: '0 8 * * 1'   # Mondays 8 AM UTC
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate full book + metadata extract
        run: node scripts/export_extract.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/all-books.csv
          git diff --staged --quiet && echo "No change to commit." || \
            (git commit -m "Weekly full book extract [automated]" && git push)
