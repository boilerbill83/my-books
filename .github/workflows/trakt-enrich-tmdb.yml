name: Enrich Trakt Metadata (TMDB)

on:
  schedule:
    - cron: '0 8 * * *'   # daily 8 AM UTC (offset from the book job's 07:00)
  workflow_dispatch:
    inputs:
      retry_empties:
        description: 'Re-attempt titles that returned no overview'
        type: boolean
        default: false
      refresh_all:
        description: 'Re-fetch every title regardless of cache (one-off backfill for a new field)'
        type: boolean
        default: false
      refresh_airing:
        description: 'Re-fetch only already-cached airing-relevant shows (nextEpisodeToAir or Returning Series/In Production) - keeps season/episode timing data fresh without a full refresh_all'
        type: boolean
        default: false
      batch_size:
        description: 'How many titles to enrich this run (default 150 on schedule)'
        type: number
        default: 150

jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch genres, cast/crew, keywords, similar titles from TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RETRY_EMPTIES: ${{ inputs.retry_empties && '1' || '0' }}
          REFRESH_ALL: ${{ inputs.refresh_all && '1' || '0' }}
          REFRESH_AIRING: ${{ inputs.refresh_airing && '1' || '0' }}
        run: python3 trakt/enrich_tmdb.py ${{ inputs.batch_size || 150 }}
        timeout-minutes: 30
      # Bill (2026-09-25): "why isn't Lioness one of my next shows to
      # watch?" traced back to this exact gap — REFRESH_AIRING existed as
      # a mode but was only ever wired to a manual workflow_dispatch
      # checkbox, so an already-cached show's nextEpisodeToAir/
      # currentSeasonFinale never got revisited once the daily step above
      # (new titles only, mutually exclusive with REFRESH_AIRING inside
      # enrich_tmdb.py's own mode selection) had already cached it once.
      # A second, dedicated step rather than folding this into the first
      # one — the script's mode logic is deliberately single-purpose per
      # run (same discipline every other Trakt enrichment script here
      # follows), so two clear, separately-logged steps beat one step
      # trying to do both under a shared batch budget. Skipped on an
      # explicit refresh_all/retry_empties/refresh_airing dispatch (those
      # already cover this ground, or the manual refresh_airing checkbox
      # already ran it above) — only runs for real on the daily schedule
      # or a plain, no-special-input manual dispatch. 332 airing-relevant
      # shows as of this session (65 needing the extra season-detail
      # call) — real measured cost ~3-8 minutes, comfortably inside the
      # timeout. Bill's explicit choice (daily, not weekly): "a date can
      # go up to ~6 days stale" under weekly was the dealbreaker, since
      # this exact bug was only 5 days stale.
      - name: Refresh already-cached shows' next-episode/finale dates
        if: ${{ !inputs.refresh_all && !inputs.retry_empties && !inputs.refresh_airing }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          REFRESH_AIRING: '1'
        run: python3 trakt/enrich_tmdb.py 500
        timeout-minutes: 20
      - name: Commit if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Rebase onto whatever branch actually triggered this run, not a
          # hardcoded main - a real bug found 2026-09-03: manually dispatching
          # these workflows against a feature branch (common this session, for
          # faster iteration than waiting on the daily main-branch schedule)
          # meant a push-reject retry rebased onto origin/main instead of the
          # feature branch it was actually running on, producing real merge
          # conflicts against unrelated main-branch history and silently
          # discarding a real TMDB API-fetch pass (topCastDetail backfill, run
          # 33701084686) that had already succeeded locally.
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          git add trakt/data/
          if git diff --staged --quiet; then
            echo "No new metadata."
            exit 0
          fi
          git commit -m "Enrich Trakt metadata via TMDB [automated]"
          # This job can run 5-10+ minutes on a refresh_all pass, long enough
          # for another scheduled workflow (e.g. sync-goodreads.yml, on its
          # own independent cron) to push to main first and reject this
          # push - hit twice in a row on 2026-08-21. Rebase and retry rather
          # than losing a long run's real output.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i/5) - fetching and rebasing onto latest $BRANCH."
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          echo "::error::Failed to push after 5 rebase attempts."
          exit 1
