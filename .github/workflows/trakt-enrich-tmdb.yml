name: Enrich Trakt Metadata (TMDB)

on:
  schedule:
    - cron: '0 8 * * *'   # daily 8 AM UTC (offset from the book job's 07:00)
  workflow_dispatch:
    inputs:
      retry_empties:
        description: 'Re-attempt titles that returned no overview'
        type: boolean
        default: false
      batch_size:
        description: 'How many titles to enrich this run (default 150 on schedule)'
        type: number
        default: 150

jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch genres, cast/crew, keywords, similar titles from TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RETRY_EMPTIES: ${{ inputs.retry_empties && '1' || '0' }}
        run: python3 trakt/enrich_tmdb.py ${{ inputs.batch_size || 150 }}
        timeout-minutes: 30
      - name: Commit if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trakt/data/
          git diff --staged --quiet && echo "No new metadata." || \
            (git commit -m "Enrich Trakt metadata via TMDB [automated]" && git push)
