name: Enrich Trakt People (TMDB person lookup)

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'How many people to enrich this run'
        type: number
        default: 300

jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch birthday/gender for lead cast members from TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 trakt/enrich_person.py ${{ inputs.batch_size || 300 }}
        timeout-minutes: 30
      - name: Commit if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trakt/data/personMetadata.json
          if git diff --staged --quiet; then
            echo "No new person metadata."
            exit 0
          fi
          git commit -m "Enrich Trakt person metadata via TMDB [automated]"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i/5) - fetching and rebasing onto latest main."
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Failed to push after 5 rebase attempts."
          exit 1
