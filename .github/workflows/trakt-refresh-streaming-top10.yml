name: Refresh Streaming Top 10 (Claude research)

# Weekly (Bill, 2026-09-26: "find ways to minimize how many api credits
# this app uses" — this was the one and only remaining automatic,
# recurring Claude-API cost anywhere in the repo; every other Claude-API
# script — audit_theme_tone.py, tag_with_haiku.py, trakt/tag_llm.py — is
# already workflow_dispatch-only, the same precedent Session 16f
# established for the book side's own theme/tone audit). Was daily until
# this change; real cost note preserved: each run is one Claude call
# (web search + editorial write-up) plus up to 15 cheap TMDB lookups — a
# few cents to roughly $0.60/run, not the "tens of dollars per pass"
# scale that got the theme/tone audit's own daily schedule turned off —
# but it IS real, recurring, billed cost, and the underlying data
# (Nielsen's weekly numbers) only actually changes about once a week, so
# a daily cadence was mostly re-researching and landing on a near-
# identical list 6 days out of 7. Monday, after the weekend's viewership
# numbers settle and ahead of the other daily Trakt enrichment jobs.

on:
  schedule:
    - cron: '0 13 * * 1'   # weekly, Mondays 1 PM UTC
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Research and rebuild The Streaming Top 10
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 trakt/refresh_streaming_top10.py
        # call_claude() can now make up to 3 sequential requests (pause_turn
        # resume, each with its own 340s timeout) — worst case ~17 minutes,
        # which the old 10-minute step ceiling would have killed outright
        # before the Python-level retry logic ever got a chance to finish.
        # 20 minutes leaves real headroom above that worst case.
        timeout-minutes: 20
      - name: Commit if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Rebase onto whatever branch actually triggered this run, not a
          # hardcoded main — same real bug trakt-resolve-titles.yml already
          # documents hitting on 2026-09-03 when manually dispatched against
          # a feature branch.
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          # streamingTop10Previous.json is glob-matched, not named directly:
          # it's only written on a run where streamingTop10.json already
          # existed on disk beforehand (refresh_streaming_top10.py's own
          # OUT_FILE.exists() gate), so it may genuinely not exist yet — a
          # bare filename here would make `git add` abort with "pathspec
          # did not match any files" (exit 128) and silently drop every
          # OTHER real change this run made too, defeating the whole point
          # of this step's own `if: always()` resiliency. Confirmed via a
          # real production failure (2026-09-28): the script crashed
          # before writing anything, and the git add for this exact
          # filename aborted the whole step. The glob always matches at
          # least streamingTop10.json itself, so it's never left
          # unexpanded.
          git add trakt/data/streamingTop10*.json trakt/data/candidatePool.json trakt/data/discoveredHistory.json trakt/data/feedbackData.json
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Refresh The Streaming Top 10 via Claude research [automated]"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i/5) - fetching and rebasing onto latest $BRANCH."
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          echo "::error::Failed to push after 5 rebase attempts."
          exit 1
      - name: Enrich any newly-discovered candidates
        if: always()
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 trakt/enrich_tmdb.py
        timeout-minutes: 10
      - name: Commit enrichment if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          git add trakt/data/enrichedMetadata.json
          if git diff --staged --quiet; then
            echo "No new enrichment."
            exit 0
          fi
          git commit -m "Enrich Trakt metadata via TMDB [automated]"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i/5) - fetching and rebasing onto latest $BRANCH."
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          echo "::error::Failed to push after 5 rebase attempts."
          exit 1
