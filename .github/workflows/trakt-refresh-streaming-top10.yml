name: Refresh Streaming Top 10 (Claude research)

# DISABLED as a recurring schedule (Bill, 2026-10-15: "I dont want to add
# API credits. from now on, let's find other ways to solve our
# problems") — this workflow bills the Anthropic API (one Claude call
# with the web_search tool per run, a few cents to ~$0.60), and the
# account genuinely ran dry (a real HTTP 400 "credit balance too low" on
# 2026-10-15), which is what surfaced this as a standing problem rather
# than a one-off. Bill's call: don't keep this as an automatic recurring
# cost at all, not even a cheap one — the real weekly freshness need is
# now covered for free instead, via a recurring Claude Code scheduled
# task that does the same research with the session's own (non-billed)
# WebSearch tool and commits directly; see CLAUDE.md's "Streaming Top
# 10 — No-Cost Refresh" section for that mechanism's full design.
#
# This workflow + refresh_streaming_top10.py are kept, not deleted —
# workflow_dispatch still works for a one-off manual run on the rare
# occasion Bill explicitly wants the Claude-API version specifically
# (e.g. to compare against the free version, or if the free mechanism
# is ever unavailable) — but nothing fires it automatically anymore.
# Do not re-add a `schedule:` trigger here without Bill's fresh,
# explicit go-ahead; see CLAUDE.md's standing policy.

on:
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Research and rebuild The Streaming Top 10
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 trakt/refresh_streaming_top10.py
        # call_claude() can make up to 3 pause_turn continuations, each of
        # which can now itself retry up to 3 times on a bare transient
        # network failure (added 2026-10-15 after a real run crashed
        # outright with http.client.RemoteDisconnected and no retry at
        # all) — a pathological worst case nests both, though in practice
        # a dropped-connection retry fails fast rather than consuming the
        # full 450s each time. 40 minutes leaves real headroom above even
        # that worst case, up from 25.
        timeout-minutes: 40
      - name: Commit if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Rebase onto whatever branch actually triggered this run, not a
          # hardcoded main — same real bug trakt-resolve-titles.yml already
          # documents hitting on 2026-09-03 when manually dispatched against
          # a feature branch.
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          # streamingTop10Previous.json is glob-matched, not named directly:
          # it's only written on a run where streamingTop10.json already
          # existed on disk beforehand (refresh_streaming_top10.py's own
          # OUT_FILE.exists() gate), so it may genuinely not exist yet — a
          # bare filename here would make `git add` abort with "pathspec
          # did not match any files" (exit 128) and silently drop every
          # OTHER real change this run made too, defeating the whole point
          # of this step's own `if: always()` resiliency. Confirmed via a
          # real production failure (2026-09-28): the script crashed
          # before writing anything, and the git add for this exact
          # filename aborted the whole step. The glob always matches at
          # least streamingTop10.json itself, so it's never left
          # unexpanded.
          git add trakt/data/streamingTop10*.json trakt/data/candidatePool.json trakt/data/discoveredHistory.json trakt/data/feedbackData.json
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Refresh The Streaming Top 10 via Claude research [automated]"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i/5) - fetching and rebasing onto latest $BRANCH."
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          echo "::error::Failed to push after 5 rebase attempts."
          exit 1
      - name: Enrich any newly-discovered candidates
        if: always()
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 trakt/enrich_tmdb.py
        timeout-minutes: 10
      - name: Commit enrichment if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          git add trakt/data/enrichedMetadata.json
          if git diff --staged --quiet; then
            echo "No new enrichment."
            exit 0
          fi
          git commit -m "Enrich Trakt metadata via TMDB [automated]"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i/5) - fetching and rebasing onto latest $BRANCH."
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          echo "::error::Failed to push after 5 rebase attempts."
          exit 1
