name: Daily Data Quality Report

on:
  schedule:
    - cron: '0 9 * * *'   # daily 9 AM UTC
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate data quality report
        run: node scripts/data_quality_report.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/data-quality-report-*.md output/data-quality-report-*.json output/data-quality-index.json
          git diff --staged --quiet && echo "No change to commit." || \
            (git commit -m "Daily data quality report [automated]" && git push)
