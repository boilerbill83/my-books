name: Scrape Show Ratings (Rotten Tomatoes + Metacritic)

on:
  schedule:
    - cron: '30 10 * * *'   # daily 10:30 AM UTC (after TMDB 8 AM + OMDb 9 AM enrichment)
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'How many titles to scrape this run (default 40)'
        type: number
        default: 40

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: Scrape Rotten Tomatoes + Metacritic for shows OMDb didn't cover
        run: python3 trakt/scrape_show_ratings.py ${{ inputs.batch_size || 40 }}
        timeout-minutes: 120
      - name: Commit if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trakt/data/scrapedShowRatings.json
          if git diff --staged --quiet; then
            echo "No new ratings scraped."
            exit 0
          fi
          git commit -m "Scrape show ratings via RT/Metacritic [automated]"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i/5) - fetching and rebasing onto latest main."
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Failed to push after 5 rebase attempts."
          exit 1
